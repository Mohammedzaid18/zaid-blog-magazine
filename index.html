<style>
:root{
  --paper:#FFFFFF;
  --ink:#0C1530;
  --slate:#535F76;
  --line:#E1E5EB;
  --accent:#2036E8;
  --cobalt:#2036E8;
  --marigold:#FFB000;
  --deep:#0C1530;
  --coral:#FF6B4A;
  --mint:#19C69B;
  --violet:#7B61FF;
  --sky:#EEF3FF;
  --blush:#FFF1EA;
  --lemon:#FFF8E1;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --text:"Source Serif 4",Georgia,"Times New Roman",serif;
  --pad:clamp(1.25rem,5vw,4rem);
  --heavy:.014em;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(4rem + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--text);font-size:1.125rem;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}
.wrap{max-width:76rem;margin:0 auto;padding:0 var(--pad)}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- cover ---------- */
.cover{position:relative;background:var(--cobalt);color:#fff;overflow:hidden;min-height:max(100svh,44rem);display:flex;flex-direction:column;padding:0 var(--pad) 0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.1rem 0;font-family:var(--display);font-size:1rem;font-weight:500;position:relative;z-index:5}
.topbar nav{display:flex;gap:1.4rem;flex-wrap:wrap;justify-content:flex-end}
.topbar a{text-decoration:none;border-bottom:2px solid transparent;padding:.15rem 0}
.topbar a:hover{border-color:var(--marigold)}
.masthead{position:relative;z-index:2;margin:clamp(1rem,3.5vh,2.5rem) 0 0;text-align:center;white-space:nowrap;font-family:var(--display);font-weight:800;font-stretch:75%;font-variation-settings:"wdth" 75;font-size:clamp(3.6rem,17.5vw,16.5rem);line-height:.86;letter-spacing:-.02em}
.cutout{position:absolute;z-index:3;bottom:0;left:50%;transform:translateX(-50%);height:76%;width:auto;pointer-events:none}
.lines{position:absolute;z-index:4;top:46%;width:min(23vw,21rem);display:grid;gap:1.6rem}
.lines.l{left:var(--pad)}
.lines.r{right:var(--pad)}
.dek{font-family:var(--display);font-size:1.05rem;line-height:1.45;margin:0;max-width:17rem;opacity:.92}
.line{text-decoration:none;display:block}
.line .k{display:block;font-family:var(--display);font-weight:600;font-size:.95rem;color:var(--marigold);margin-bottom:.15rem}
.line .t{display:inline;font-family:var(--display);font-weight:800;-webkit-text-stroke:.015em currentColor;font-size:clamp(1.15rem,1.9vw,1.6rem);line-height:1.15;background:linear-gradient(var(--marigold),var(--marigold)) 0 100%/0 .14em no-repeat;transition:background-size .25s}
.line:hover .t,.line:focus-visible .t{background-size:100% .14em}
.sticker{position:absolute;z-index:5;left:calc(50% + min(10.5vw,9.5rem));bottom:14%;width:7.4rem;height:7.4rem;border-radius:50%;background:var(--marigold);color:var(--deep);display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1.05;transform:rotate(-11deg);padding:.6rem}
.sticker b{display:block;font-size:2rem;line-height:.95}

@media (max-width:40rem){.topbar>span:first-child{display:none}.topbar{justify-content:center}.topbar nav{justify-content:center;gap:1.1rem}}
@media (max-width:60rem){
  .cover{min-height:0;padding-bottom:0}
  .masthead span{display:block;width:max-content;margin:0 auto}
  .cutout{position:relative;left:auto;transform:none;height:26rem;margin:.4rem auto 0;z-index:3}
  .lines{position:static;width:auto;z-index:4}
  .lines.l{order:3;background:var(--deep);margin:0 calc(-1 * var(--pad));padding:1.8rem var(--pad) .5rem}
  .lines.r{order:4;background:var(--deep);margin:0 calc(-1 * var(--pad));padding:.5rem var(--pad) 2rem}
  .sticker{display:none}
}

/* ---------- sections ---------- */
.block{padding-top:clamp(3rem,7vw,5.5rem);padding-bottom:clamp(3rem,7vw,5.5rem)}
h2.sec{font-family:var(--display);font-weight:800;-webkit-text-stroke:var(--heavy) currentColor;font-size:clamp(2.4rem,6vw,4.4rem);letter-spacing:-.022em;line-height:1;margin:0 0 .6rem}
.sec-lede{color:var(--slate);margin:0 0 2.2rem;max-width:36rem}

/* story tiles */
.mag{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:1.25rem}
.tile{display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;padding:clamp(1.25rem,2.4vw,2rem);min-height:17rem;grid-column:span 5;position:relative}
.tile:first-child{grid-column:span 7;grid-row:span 2;min-height:36rem}
.tile .k{font-family:var(--display);font-weight:600;font-size:1rem;opacity:.85}
.tile h3{font-family:var(--display);font-weight:800;-webkit-text-stroke:var(--heavy) currentColor;font-stretch:85%;font-variation-settings:"wdth" 85;line-height:1;letter-spacing:-.02em;font-size:clamp(1.9rem,3.4vw,2.9rem);margin:1.5rem 0 1rem;max-width:30rem}
.tile:first-child h3{font-size:clamp(2.6rem,6vw,5.2rem)}
.tile h3 span{background:linear-gradient(currentColor,currentColor) 0 100%/0 .08em no-repeat;transition:background-size .25s}
.tile:hover h3 span,.tile:focus-visible h3 span{background-size:100% .08em}
.tile p{margin:0 0 1.2rem;font-size:1.02rem;line-height:1.5;max-width:30rem;opacity:.92}
.tile .m{font-family:var(--display);font-size:.95rem;opacity:.85}
@media (max-width:52rem){.tile,.tile:first-child{grid-column:1/-1;grid-row:auto;min-height:15rem}.tile:first-child{min-height:24rem}}

/* photo album */
.album{display:flex;gap:1.25rem;align-items:stretch}
.acol{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:1.25rem}
.acol>*:last-child{flex:1 1 auto}
.acol>.ph:last-child{display:flex;align-items:flex-start;background:#0C1530;padding-bottom:4.6rem}
.acol>.ph:last-child::after{display:none}
.acol>.ph:last-child .cap{color:#fff}
.acol>.ph{width:100%}
.ph{position:relative;display:block;padding:0;border:0;background:#E9EDF3;overflow:hidden;text-align:left;color:#fff}
.ph img{width:100%;height:auto;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.ph:hover img,.ph:focus-visible img{transform:scale(1.045)}
.ph::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(to top,rgba(8,14,32,.82),rgba(8,14,32,0));pointer-events:none}
.ph .cap{position:absolute;left:1.1rem;right:1.1rem;bottom:1rem;z-index:2;font-family:var(--display);line-height:1.2}
.ph .cap b{display:block;font-weight:800;font-size:1.25rem;-webkit-text-stroke:.015em currentColor}
.ph .cap span{display:block;font-size:.92rem;opacity:.9;margin-top:.2rem}
.ph .zoom{position:absolute;top:.9rem;right:.9rem;z-index:2;width:2.3rem;height:2.3rem;border-radius:50%;background:#fff;color:var(--deep);display:grid;place-items:center;font-size:1.1rem;line-height:1;opacity:0;transition:opacity .2s}
.ph:hover .zoom,.ph:focus-visible .zoom{opacity:1}
.album .panel{background:var(--deep);color:#fff;padding:clamp(1.2rem,2vw,1.8rem);min-width:0;min-height:16rem;display:flex;flex-direction:column;justify-content:space-between}
.panel h3{font-family:var(--display);font-weight:800;-webkit-text-stroke:var(--heavy) currentColor;font-stretch:85%;font-variation-settings:"wdth" 85;font-size:clamp(1.55rem,2.2vw,2.1rem);line-height:1;letter-spacing:-.02em;margin:0;overflow-wrap:break-word}
.panel h3 em{font-style:normal;color:var(--marigold)}
.panel p{margin:1rem 0 0;font-family:var(--display);font-size:1rem;color:#C3CCE0}
@media (max-width:52rem){
  .album,.acol{gap:.75rem}
  .ph .zoom{opacity:1}
}
/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(6,10,24,.985);color:#fff;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:max(1rem,env(safe-area-inset-top,0px)) 1rem max(1rem,env(safe-area-inset-bottom,0px));font-family:var(--display)}
.lb-top{display:flex;justify-content:space-between;align-items:center;font-size:1rem}
.lb button{background:none;border:2px solid #fff;color:#fff;border-radius:50%;width:2.9rem;height:2.9rem;font-size:1.25rem;line-height:1;display:grid;place-items:center}
.lb button:hover{background:var(--marigold);border-color:var(--marigold);color:var(--deep)}
.lb-stage{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:1rem;min-height:0}
.lb-stage img{max-width:100%;max-height:100%;margin:auto;object-fit:contain;min-height:0;height:100%;width:100%}
.lb-cap{text-align:center;padding-top:.8rem}
.lb-cap b{font-weight:800;font-size:1.3rem;display:block}
.lb-cap span{color:#C3CCE0;font-size:1rem}
.lb-info{max-width:44rem;margin:.6rem auto 0;color:#D6DDEC;font-size:1rem;line-height:1.5}
.lb-go{display:inline-block;margin-top:.5rem;color:var(--marigold);font-weight:800}
@media (max-width:40rem){.lb-stage{grid-template-columns:minmax(0,1fr)}.lb-stage>button{display:none}.lb-nav-m{display:flex !important}}
.lb-nav-m{display:none;justify-content:center;gap:1rem;padding-top:.8rem}

/* about */
.about{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(2rem,6vw,5rem);align-items:start}
.arch{width:min(100%,19rem);aspect-ratio:3/4;object-fit:cover;border-radius:999px 999px 0 0;background:var(--marigold)}
.about p{margin:0 0 1.1rem;max-width:36rem}
.timeline{list-style:none;margin:2.2rem 0 0;padding:0 0 0 1.4rem;border-left:3px solid var(--ink)}
.timeline li{position:relative;padding:0 0 1.5rem}
.timeline li::before{content:"";position:absolute;left:calc(-1.4rem - 8px);top:.5rem;width:13px;height:13px;background:var(--marigold);border:3px solid var(--ink);border-radius:50%}
.timeline .when{font-family:var(--display);font-size:.95rem;color:var(--slate);display:block}
.timeline .what{font-family:var(--display);font-weight:800;font-size:1.15rem;line-height:1.3;display:block}
.timeline .where{font-size:1rem;color:var(--slate)}
@media (max-width:52rem){.about{grid-template-columns:1fr}}

/* contact */
.contact{background:var(--deep);color:#fff}
.contact .sec-lede{color:#B8C2D8}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(13rem,1fr));border-top:2px solid var(--marigold)}
.links a{font-family:var(--display);font-weight:800;font-size:1.45rem;text-decoration:none;padding:1.2rem 1rem 1.2rem 0;border-bottom:1px solid #2A3658;display:flex;flex-direction:column}
.links a small{font-weight:400;color:#B8C2D8;font-size:.95rem}
.links a:hover{color:var(--marigold)}
footer.foot{padding:1.6rem 0 2.4rem;font-family:var(--display);font-size:.95rem;color:var(--slate)}
.contact-wrap{padding-top:clamp(3rem,7vw,5rem);padding-bottom:clamp(3rem,7vw,5rem)}


/* tiles for 8 stories */
.mag .tile:nth-child(n+4){grid-column:span 4;min-height:15rem}
.mag .tile:nth-child(n+7){grid-column:span 6}
@media (max-width:52rem){.mag .tile:nth-child(n+4){grid-column:1/-1}}

/* project index */
.chips{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1.6rem}
.chip{font-family:var(--display);font-weight:800;font-size:1rem;padding:.5rem 1rem;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.chip:hover{background:var(--marigold);border-color:var(--marigold);color:#0C1530}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.work{border-top:3px solid var(--ink)}
.work details{border-bottom:1px solid var(--line)}
.work summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 9rem 2rem;gap:1rem;align-items:baseline;padding:1.2rem 0}
.work summary::-webkit-details-marker{display:none}
.work summary h3{margin:0;justify-self:start;font-family:var(--display);font-weight:800;-webkit-text-stroke:var(--heavy) currentColor;font-size:clamp(1.5rem,3.2vw,2.5rem);line-height:1;letter-spacing:-.025em}
.work summary .cat{font-family:var(--display);color:var(--slate);font-size:1rem}
.work summary .pm{font-family:var(--display);font-weight:800;font-size:1.6rem;text-align:right;transition:transform .2s}
.work details[open] .pm{transform:rotate(45deg)}
.work summary h3{background:linear-gradient(var(--marigold),var(--marigold)) 0 92%/0 .14em no-repeat;transition:background-size .25s}.work summary:hover h3,.work summary:focus-visible h3{background-size:100% .14em}
.work .more-in{padding:0 0 1.6rem;max-width:44rem}
.work .more-in p{margin:0 0 .8rem}
.work .stack{font-family:var(--display);font-size:.95rem;color:var(--slate)}
.work .go{font-family:var(--display);font-weight:800;text-decoration:none;border-bottom:3px solid var(--marigold);display:inline-block;margin-top:.4rem}
.work .go:hover{background:var(--marigold)}
@media (max-width:40rem){.work summary{grid-template-columns:minmax(0,1fr) 2rem}.work summary .cat{display:none}}

/* article widgets */
.tool{border:3px solid var(--ink);padding:1.4rem 1.5rem;margin:2rem 0;font-family:var(--display)}
.tool h3{margin:0 0 .3rem;font-size:1.35rem;font-weight:800}
.tool p.sub{margin:0 0 1rem;color:var(--slate);font-size:1rem}
.donors{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin:1.2rem 0 1rem}
.donor{font-weight:800;font-size:1.3rem;text-align:center;padding:.9rem 0;border:2px solid var(--line);color:#B4BCC9;transition:background .2s,color .2s,border-color .2s}
.donor.yes{background:var(--marigold);border-color:var(--marigold);color:#0C1530}
.tool .res{margin:0;padding:.9rem 1rem;background:var(--deep);color:#fff;font-size:1.05rem;line-height:1.4}
.tool .res .big{display:block;font-weight:800;font-size:clamp(2.2rem,7vw,3.4rem);line-height:1;color:var(--marigold);-webkit-text-stroke:.02em currentColor}
.ach{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.ach li{display:grid;grid-template-columns:3.4rem minmax(0,1fr) auto;gap:.3rem 1rem;padding:.8rem 0;border-bottom:1px solid var(--line);align-items:baseline;font-family:var(--display)}
.ach .yr{color:var(--slate);font-size:.95rem}
.ach b{font-weight:800;font-size:1.08rem;line-height:1.25;display:block}
.ach small{color:var(--slate);font-size:.92rem}
.ach .r{font-weight:800;font-size:.95rem;text-align:right}
.ach a{color:var(--accent);font-size:.9rem;margin-left:.4rem}
.note{font-size:.95rem;color:var(--slate);font-style:italic}
@media (max-width:40rem){.ach li{grid-template-columns:2.8rem minmax(0,1fr)}.ach .r{grid-column:2;text-align:left}}


/* extra styling */
::selection{background:var(--marigold);color:#0C1530}
.sub-h{font-family:var(--display);font-weight:800;-webkit-text-stroke:var(--heavy) currentColor;font-size:clamp(1.8rem,3.6vw,2.6rem);letter-spacing:-.025em;line-height:1;margin:clamp(2.5rem,5vw,4rem) 0 .6rem}
.stick{position:fixed;top:0;left:0;right:0;z-index:40;background:#fff;border-bottom:3px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.65rem var(--pad);padding-top:calc(.65rem + env(safe-area-inset-top,0px));font-family:var(--display);transform:translateY(-105%);transition:transform .25s}
.stick.on{transform:none}
.stick .mark{font-weight:800;text-decoration:none;font-size:1.15rem;-webkit-text-stroke:.02em currentColor}
.stick nav{display:flex;flex-wrap:wrap;justify-content:center;gap:.2rem 1.1rem;font-weight:600;font-size:1rem}@media (max-width:26rem){.stick nav{gap:.2rem .8rem;font-size:.92rem}}
.stick nav a{text-decoration:none;border-bottom:2px solid transparent}
.stick nav a:hover{border-color:var(--marigold)}
@media (max-width:40rem){.stick .mark{display:none}.stick{justify-content:center}}
.tile::after{content:"\2197";position:absolute;top:1.1rem;right:1.4rem;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1;transition:transform .25s}
.tile:hover::after,.tile:focus-visible::after{transform:translate(5px,-5px)}
.wordmark{font-family:var(--display);font-weight:800;font-stretch:88%;font-variation-settings:"wdth" 88;color:var(--marigold);font-size:clamp(2.4rem,8.2vw,8.5rem);line-height:.95;letter-spacing:-.015em;margin:clamp(2.5rem,6vw,4.5rem) 0 0}
.fig{width:min(60rem,94vw);margin:2.5rem 0 2.5rem calc(50% - min(30rem,47vw))}
.fig img{width:100%;height:auto}
.fig.tall{width:min(21rem,86vw);margin:2rem 0 2rem calc(50% - min(10.5rem,43vw))}
.fig figcaption{font-family:var(--display);font-size:.95rem;color:var(--slate);padding-top:.6rem}
.copy{background:none;border:0;padding:0;font-family:var(--display);font-weight:800;font-size:inherit;color:inherit;border-bottom:2px solid currentColor;cursor:pointer}
.copy:hover{opacity:.75}

/* skills marquee */
.ribbon{background:var(--marigold);color:#0C1530;overflow:hidden;border-top:4px solid var(--deep);border-bottom:4px solid var(--deep)}
.rtrack{display:flex;width:max-content;animation:mq 38s linear infinite}
.ribbon:hover .rtrack{animation-play-state:paused}
.rset{display:flex;flex:none;align-items:center}
.ri{display:flex;align-items:center;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:clamp(1.35rem,3vw,2.3rem);letter-spacing:-.015em;padding:.85rem 0}
.ri::after{content:"";flex:none;width:.5em;height:.5em;margin:0 1.5rem;background:var(--m,#0C1530);transform:rotate(45deg)}
@keyframes mq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){
  .rtrack{animation:none;width:100%;justify-content:center;padding:0 var(--pad)}
  .rset{flex:0 1 auto;max-width:100%;flex-wrap:wrap;justify-content:center}
  .rset[aria-hidden="true"]{display:none}
  .ri{padding:.25rem 0;font-size:clamp(1.05rem,2vw,1.45rem)}
  .ri::after{margin:0 .9rem}
  .ri:last-child::after{display:none}
  .rtrack{padding-top:.7rem;padding-bottom:.7rem}
}

/* photo header + filters */
.ph-head{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.5rem clamp(2rem,5vw,4rem);align-items:end;margin-bottom:2.2rem}
.ph-head .sec-lede{margin-bottom:0}
.ph-head h2.sec{margin-bottom:.8rem}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem}
.flt{font-family:var(--display);text-align:left;border:0;padding:1rem 1rem .9rem;background:var(--c);color:var(--t);cursor:pointer;transition:transform .15s,box-shadow .15s}
.flt b{display:block;font-weight:800;font-size:clamp(2rem,3.6vw,2.9rem);line-height:1;letter-spacing:-.02em}
.flt span{display:block;font-weight:700;font-size:.92rem;margin-top:.35rem}
.flt:hover{transform:translateY(-2px)}
.flt[aria-pressed="true"]{box-shadow:0 6px 0 var(--marigold),0 0 0 3px var(--ink);transform:translateY(-3px)}
@media (max-width:52rem){.ph-head{grid-template-columns:1fr}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* bands and colour */
.band{width:100%}
.band.sky{background:var(--sky)}
.band.blush{background:var(--blush)}
.band.lemon{background:var(--lemon)}

    date:"2026-09-29",
    tag:"AI",
    summary:"Input, thinking, memory, action, result. Scroll through the five-part loop behind every agent, then see what it could mean for public services in India.",
    bg:"#0C1530", fg:"#FFB000",
    body:`
      <p>Most people use a chatbot as a question box: you ask, it answers, and that is the end of it. An agent is different. It is given a goal, works out the steps, uses tools to carry them out, and checks what happened before it answers.</p>
      <p>Every agent I have looked at runs the same loop of five parts. Scroll down and watch the panel follow along with a made-up example.</p>

      <div class="scrolly">
        <div class="stage" aria-label="The agent loop, following the example task">
          <p class="task"><b>Example task:</b> &ldquo;Renew my driving licence. I only speak Marathi.&rdquo;</p>
          <ol class="loop">
            <li class="on"><button type="button"><i>1</i><span>Input</span></button><p>You speak the request in Marathi. Bhashini turns it into text the model can read.</p></li>
            <li><button type="button"><i>2</i><span>Thinking</span></button><p>The model plans: check licence status, find the renewal form, verify documents, book a slot.</p></li>
            <li><button type="button"><i>3</i><span>Memory</span></button><p>It recalls your earlier application and which documents were already verified.</p></li>
            <li><button type="button"><i>4</i><span>Action</span></button><p>It calls the licensing portal and the appointment system through their APIs.</p></li>
            <li><button type="button"><i>5</i><span>Result</span></button><p>You hear it back in Marathi: renewal filed, appointment fixed, every step logged for review.</p></li>
          </ol>
          <p class="back">The result goes back into memory, so the next task starts smarter.</p>
        </div>
        <div class="steps">
          <div class="step" data-i="0"><h3>It starts with a person and a task</h3><p>The user gives a task or question in natural language, by typing or by speaking. The agent has to turn that into something a model can work with.</p></div>
          <div class="step" data-i="1"><h3>The model makes a plan</h3><p>It breaks the goal down into steps. Planning methods such as ReAct make it reason, act, look at what happened, and reason again.</p></div>
          <div class="step" data-i="2"><h3>Memory keeps the steps connected</h3><p>The agent recalls relevant information and keeps context, so step four knows what step one found. Without it, every step starts from zero.</p></div>
          <div class="step" data-i="3"><h3>Action is what makes it an agent</h3><p>It uses tools or APIs, such as web search, a database or code, to do real work instead of only describing it.</p></div>
          <div class="step" data-i="4"><h3>The result, and the loop closes</h3><p>You get the final answer, insight or action in a clear, useful format. What happened is fed back so the agent keeps improving.</p></div>
        </div>
      </div>

      <h2>What the stack usually contains</h2>
      <ul>
        <li>A language model (LLM, or a smaller SLM) as the reasoning core</li>
        <li>Step-by-step planning with ReAct</li>
        <li>Verified data search with retrieval-augmented generation (RAG)</li>
        <li>Indian APIs and cloud services</li>
        <li>Bhashini for Indian languages</li>
      </ul>

      <h2>An idea for public services: a Bharati Agent Grid</h2>
      <p>In a deck I put together on Viksit Bharat @2047, I proposed one common agent platform, built on India's digital public infrastructure, that every department and state could use instead of many separate apps.</p>
      <figure class="fig"><img src="images/ai-talk-1.jpg" alt="Illustration of a presenter pointing at a slide about how AI builds Viksit Bharat at 2047" loading="lazy"><figcaption>Illustration of the Viksit Bharat @2047 talk, made with ChatGPT.</figcaption></figure>
      <aside class="pull"><p>An agent people cannot audit is an agent people will not trust with anything important.</p></aside>
      <p>Two design choices matter most. First, it works by voice in local languages through Bhashini, so no one is left behind because of language or literacy. Second, every action is recorded and can be reviewed, so the system stays clear, safe and trusted.</p>
      <p>I explored the building blocks in Phoenix AI, a modular prompt engineering framework with pluggable tool-chaining for automation in healthcare, CRM and business. I will write more about each part of the loop, starting with memory, since that is where most agents I see fall over.</p>

      <p>The platform has three parts. A real-time dashboard shows how many units of each type are available. A matching engine checks ABO and Rh compatibility. And an emergency request queue routes the most urgent cases first. It is built with React, Node.js and MongoDB.</p>
      <h2>The rule underneath: ABO and Rh</h2>
      <p>Red blood cells can carry an A marker, a B marker, both, or neither, plus an Rh marker that is positive or negative. A patient's immune system reacts to markers it does not have. So O negative cells, which carry none, can go to almost anyone, while AB positive patients can receive from every group.</p>
      <div data-widget="blood"></div>
      <h2>Why matching is more than a lookup table</h2>
      <p>A table tells you which groups are compatible. A useful system also has to answer two more questions: which compatible unit should be used first, and what happens when two patients need the same scarce unit?</p>
      <aside class="pull"><p>In an emergency queue, first come, first served is the wrong rule.</p></aside>
      <p>That is why the request queue is priority-based. A critical trauma request should move ahead of a routine one, even if it arrived later, and the dashboard has to show the shelf as it is now, not as it was an hour ago.</p>

    title:"Reading the road: a YOLOv8, ByteTrack and EasyOCR pipeline",
    date:"2026-09-19",
    tag:"AI",
    summary:"How a smart-city traffic system finds vehicles, follows them and reads plates, and how it was tested end to end.",
    bg:"#19C69B", fg:"#0C1530",
    body:`
      <p>I built an AI traffic monitoring and speed detection system as a full-stack smart-city platform. A FastAPI backend runs the AI pipeline, and a Next.js 14 dashboard shows what it finds. The pipeline combines three tools: YOLOv8, ByteTrack and EasyOCR.</p>
      <p>Here is how a pipeline like this fits together, following one imaginary car through it.</p>

      <div class="scrolly">
        <div class="stage" aria-label="The traffic pipeline, following one car">
          <p class="task"><b>Example:</b> a white hatchback passes the camera.</p>
          <ol class="loop">
            <li class="on"><button type="button"><i>1</i><span>Detect</span></button><p>YOLOv8 finds the car in the frame and draws a box around it.</p></li>
            <li><button type="button"><i>2</i><span>Track</span></button><p>ByteTrack gives the box an ID and keeps that ID from frame to frame.</p></li>
            <li><button type="button"><i>3</i><span>Measure</span></button><p>How far the tracked box moves over time gives the car's speed.</p></li>
            <li><button type="button"><i>4</i><span>Read</span></button><p>EasyOCR reads the number plate from the cropped image.</p></li>
            <li><button type="button"><i>5</i><span>Report</span></button><p>The event is stored by the API and appears on the dashboard.</p></li>
          </ol>
          <p class="back">Each stage only trusts what the stage before it produced.</p>
        </div>
        <div class="steps">
          <div class="step" data-i="0"><h3>Detect: what is in the picture?</h3><p>YOLOv8 looks at every video frame and marks each vehicle with a box and a class, such as car, bus or motorbike. It answers what and where, one frame at a time.</p></div>
          <div class="step" data-i="1"><h3>Track: is it the same car?</h3><p>Detection alone has no memory. ByteTrack links boxes across frames so a car that appears in frames 10, 11 and 12 is counted once, with one identity.</p></div>
          <div class="step" data-i="2"><h3>Measure: how fast is it going?</h3><p>Once a car has a track, its movement can be turned into speed. That needs the camera to be calibrated, so pixels can be converted into real distance.</p></div>
          <div class="step" data-i="3"><h3>Read: which plate is it?</h3><p>EasyOCR reads the characters from the plate region. Plates are small, angled and often blurred, so this is where most of the difficulty hides.</p></div>
          <div class="step" data-i="4"><h3>Report: who needs to see it?</h3><p>The backend stores each event, and the dashboard turns the stream into something an operator can act on.</p></div>
        </div>
      </div>

      <h2>How I tested it</h2>
      <p>An AI demo that works once is not a system. The backend has 51 passing tests, the dashboard has 15 routes, and I ran real browser sessions with Playwright to check the whole thing from the operator's side.</p>
      <aside class="pull"><p>Numbers on a dashboard are only as good as the tests behind them.</p></aside>
      <h2>Security along the way</h2>
      <p>While working on this and my portfolio I found and fixed a bcrypt and JWT token collision vulnerability, and upgraded Next.js to address a known CVE. Neither shows up in a demo, and both matter more than another feature.</p>

    body:`
      <p>StyleSync is an AI wardrobe assistant aimed at Gen Z users in India. I delivered it as a full product design document: UX persona research, technical architecture, marketing strategy and privacy compliance, all as polished interactive HTML documents.</p>
      <h2>Two models, two jobs</h2>
      <p>The system needs to answer two different questions. First, what is this garment? An EfficientNet-B0 model handles outfit recognition from photos. Second, what will this person want to wear? LightFM collaborative filtering handles recommendations, learning from what similar users liked.</p>
      <p>Keeping those jobs separate makes each one easier to test and replace.</p>

function postPage(slug){
  const i = POSTS.findIndex(p => p.slug === slug);
  if(i < 0) return notFound();
  const p = POSTS[i];
  const others = [POSTS[(i+1)%POSTS.length], POSTS[(i+2)%POSTS.length]];
  document.title = p.title + ' | ' + SITE.short;
  return `
  <header class="post-head" style="background:${p.bg};color:${p.fg}">
    <div class="topbar"><a href="#/" style="font-weight:800">${esc(SITE.short)}</a><a href="#/stories">All stories</a></div>
    <div class="in">
      <p class="k">${esc(p.kicker)}</p>
      <h1>${esc(p.title)}</h1>
      <p class="byline"><span>By ${esc(SITE.name)}</span><span>${fmt(p.date)}</span><span>${mins(p)} min read</span><button type="button" class="copy" id="copylink">Copy link</button></p>
    </div>
  </header>
  <article class="prose">${p.body}</article>
  <section class="more"><h2>Keep reading</h2>${tiles(others)}</section>
  <footer class="foot wrap">${esc(SITE.issue)}. Written in Mumbai by ${esc(SITE.name)}.</footer>`;
}

function notFound(){
  return `<div class="prose"><h2>Page not found</h2><p>That story does not exist. <a href="#/">Back to the cover</a>.</p></div>`;
}

/* ---------- interactive pieces ---------- */
function enhance(){

  // ---------- article widgets ----------
  const W = {
    blood(el){
      const groups = ['O-','O+','A-','A+','B-','B+','AB-','AB+'];
      const ag = g => g.replace(/[+-]/,'').replace('O','').split('');
      const canGive = (d, r) => ag(d).every(x => ag(r).includes(x)) && (d.endsWith('-') || r.endsWith('+'));
      el.innerHTML = `<div class="tool"><h3>Who can this patient receive from?</h3><p class="sub">Pick a patient's blood group. Compatible red cell donors light up.</p>
        <div class="chips" role="group" aria-label="Patient blood group">${groups.map((g,i)=>`<button type="button" class="chip" data-g="${g}" aria-pressed="false">${g.replace('-','&minus;')}</button>`).join('')}</div>
        <div class="donors" aria-hidden="true">${groups.map(g=>`<div class="donor" data-d="${g}">${g.replace('-','&minus;')}</div>`).join('')}</div>
        <p class="res" aria-live="polite">Choose a group above.</p></div>`;
      const out = el.querySelector('.res');
      el.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
        el.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
        const r = b.dataset.g;
        const ok = groups.filter(d => canGive(d, r));
        el.querySelectorAll('.donor').forEach(d => d.classList.toggle('yes', ok.includes(d.dataset.d)));
        const f = g => g.replace('-','\u2212');
        out.textContent = f(r) + ' patients can receive red cells from ' + ok.map(f).join(', ') + '.';
      }));
    },
    checks(el){
      el.innerHTML = `<div class="tool"><h3>How was each game checked?</h3><p class="sub">Pick a game.</p>
        <div class="chips" role="group" aria-label="Game">${CHECKS.map((c,i)=>`<button type="button" class="chip" data-i="${i}" aria-pressed="${i===0}">${esc(c.game)}</button>`).join('')}</div>
        <p class="res" aria-live="polite"></p></div>`;
      const out = el.querySelector('.res');
      const show = i => { const c = CHECKS[i]; out.innerHTML = `<span class="big">${esc(c.stat)}</span><b>${esc(c.label)}.</b> ${esc(c.text)}`; };
      show(0);
      el.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
        el.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
        show(Number(b.dataset.i));
      }));
    },
    achievements(el){
      const cats = ['All','Hackathons','Data','AI and marketing','Engineering'];
      const list = ACHIEVEMENTS.slice().sort((a,b) => b.sort - a.sort);
      el.innerHTML = `<div class="tool"><h3>Hackathons and certificates</h3><p class="sub">Filter by thread.</p>
        <div class="chips" role="group" aria-label="Filter achievements">${cats.map((c,i)=>`<button type="button" class="chip" data-c="${c}" aria-pressed="${i===0}">${c}</button>`).join('')}</div>
        <ul class="ach"></ul></div>`;
      const ul = el.querySelector('.ach');
      const draw = c => { ul.innerHTML = list.filter(a => c === 'All' || a.type === c).map(a =>
        `<li><span class="yr">${a.year}</span><div><b>${esc(a.title)}${a.url?`<a href="${a.url}" target="_blank" rel="noopener">Verify</a>`:''}</b><small>${esc(a.org)}</small></div><span class="r">${esc(a.res)}</span></li>`).join(''); };
      draw('All');
      el.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
        el.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
        draw(b.dataset.c);
      }));
    }
  };
  document.querySelectorAll('[data-widget]').forEach(el => { const f = W[el.dataset.widget]; if(f) f(el); });

  // ---------- project filter ----------
  document.querySelectorAll('.chips[aria-label="Filter projects"] .chip').forEach(b => b.addEventListener('click', () => {
    const c = b.dataset.cat;
    document.querySelectorAll('.chips[aria-label="Filter projects"] .chip').forEach(x => x.setAttribute('aria-pressed', x === b));
    document.querySelectorAll('.work details').forEach(d => { d.hidden = !(c === 'All' || d.dataset.cat === c); });
  }));

  // photo filter
  document.querySelectorAll('.flt').forEach(b => b.addEventListener('click', () => {
    const a = document.querySelector('.album'); if(!a) return;
    a.dataset.tag = b.dataset.t; a.innerHTML = album(b.dataset.t);
    document.querySelectorAll('.flt').forEach(x => x.setAttribute('aria-pressed', x === b));
  }));

  // copy link
  const cl = document.getElementById('copylink');
  if(cl) cl.addEventListener('click', async () => {
    try{ await navigator.clipboard.writeText(location.href); cl.textContent = 'Link copied'; }
    catch(e){ cl.textContent = 'Copy from the address bar'; }
    setTimeout(() => cl.textContent = 'Copy link', 2200);
  });

  // photo album lightbox
  const grid = document.querySelector('.album');
  if(grid){
    const tilesAll = document.querySelectorAll('.album .ph, .spreads .sp-img');
    let cur = 0, opener = null, box = null;
    const show = n => {
      cur = (n + ALL_PHOTOS.length) % ALL_PHOTOS.length;
      const e = ALL_PHOTOS[cur];
      box.querySelector('.lb-img').src = e.img;
      box.querySelector('.lb-img').alt = e.alt;
      box.querySelector('.lb-cap b').textContent = e.cap;
      box.querySelector('.lb-cap span').textContent = e.sub;
      const inf = box.querySelector('.lb-info'); inf.textContent = e.info || ''; inf.hidden = !e.info;
      const go = box.querySelector('.lb-go'); go.hidden = !e.story; if(e.story) go.href = '#/post/' + e.story;
      box.querySelector('.lb-count').textContent = 'Photo ' + (cur + 1) + ' of ' + ALL_PHOTOS.length;
    };
    const close = () => { if(!box) return; box.remove(); box = null; document.body.style.overflow = ''; document.removeEventListener('keydown', onKey); if(opener) opener.focus(); };
    const onKey = ev => {
      if(ev.key === 'Escape') close();
      else if(ev.key === 'ArrowRight') show(cur + 1);
      else if(ev.key === 'ArrowLeft') show(cur - 1);
      else if(ev.key === 'Tab'){
        const f = [...box.querySelectorAll('button')].filter(b => b.offsetParent);
        const first = f[0], last = f[f.length - 1];
        if(ev.shiftKey && document.activeElement === first){ ev.preventDefault(); last.focus(); }
        else if(!ev.shiftKey && document.activeElement === last){ ev.preventDefault(); first.focus(); }
      }
    };
    const open = (n, btn) => {
      opener = btn;
      box = document.createElement('div');
      box.className = 'lb'; box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true'); box.setAttribute('aria-label','Photo viewer');
      box.innerHTML = `<div class="lb-top"><span class="lb-count"></span><button type="button" class="lb-close" aria-label="Close">&times;</button></div>
        <div class="lb-stage"><button type="button" class="lb-prev" aria-label="Previous photo">&larr;</button><img class="lb-img" alt=""><button type="button" class="lb-next" aria-label="Next photo">&rarr;</button></div>
        <div><div class="lb-cap"><b></b><span></span><p class="lb-info"></p><a class="lb-go" hidden>Read the story</a></div><div class="lb-nav-m"><button type="button" class="lb-prev" aria-label="Previous photo">&larr;</button><button type="button" class="lb-next" aria-label="Next photo">&rarr;</button></div></div>`;
      document.body.appendChild(box);
      document.body.style.overflow = 'hidden';
      box.querySelector('.lb-close').addEventListener('click', close);
      box.querySelectorAll('.lb-prev').forEach(b => b.addEventListener('click', () => show(cur - 1)));
      box.querySelectorAll('.lb-next').forEach(b => b.addEventListener('click', () => show(cur + 1)));
      box.addEventListener('click', ev => { if(ev.target === box || ev.target.classList.contains('lb-stage')) close(); });
      document.addEventListener('keydown', onKey);
      show(n);
      box.querySelector('.lb-close').focus();
    };
    [grid, document.querySelector('.spreads')].forEach(c => c && c.addEventListener('click', ev => {
      const b = ev.target.closest('.ph, .sp-img'); if(b) open(Number(b.dataset.i), b);
    }));
  }

  // scrollytelling: the stage follows the step in view
  const steps = [...document.querySelectorAll('.step')];
  const items = [...document.querySelectorAll('.loop li')];
  if(steps.length && items.length){
    const setOn = n => items.forEach((li,i) => {
      li.classList.toggle('on', i === n);
      li.querySelector('button').setAttribute('aria-current', i === n ? 'step' : 'false');
    });
    const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) setOn(Number(e.target.dataset.i)); }),
      {rootMargin:'-42% 0px -42% 0px'});
    steps.forEach(s => io.observe(s));
    items.forEach((li,i) => li.querySelector('button').addEventListener('click', () =>
      steps[i].scrollIntoView({block:'center', behavior: reduce ? 'auto' : 'smooth'})));
    setOn(0);
  }

  // clinic-site self check
  document.querySelectorAll('[data-audit]').forEach(box => {
    const out = box.querySelector('.out');
    const boxes = [...box.querySelectorAll('input')];
    const msgs = [
      'Tick what your site already does.',
      'A start. The unticked jobs are where enquiries are getting lost.',
      'Halfway. Fix the follow-up step before adding anything new.',
      'Nearly there. Fix the last unticked job first.',
      'All four covered. Next, measure which one works hardest.'
    ];
    boxes.forEach(b => b.addEventListener('change', () => {
      const n = boxes.filter(x => x.checked).length;
      out.textContent = n === 0 ? msgs[0] : n + ' of 4. ' + msgs[n];
    }));
  });
}

// size the masthead so the name always fits the cover edge to edge
function fitMasthead(){
  const m = document.querySelector('.masthead');
  if(!m) return;
  m.style.fontSize = '100px';
  const avail = m.parentElement.clientWidth - 2 * parseFloat(getComputedStyle(m.parentElement).paddingLeft);
  const rg = document.createRange(); rg.selectNodeContents(m);
  const tw = Math.max(1, rg.getBoundingClientRect().width);
  const size = Math.min(100 * avail * .985 / tw, innerWidth > 960 ? 264 : 170);
  m.style.fontSize = size + 'px';
}
addEventListener('resize', () => {
  fitMasthead();
  const a = document.querySelector('.album');
  if(a && String(albumCols()) !== a.dataset.cols){ a.dataset.cols = albumCols(); a.innerHTML = album(a.dataset.tag); }
});
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitMasthead);

// reading progress bar
const bar = document.getElementById('prog');
let ticking = false;
function onScroll(){
  if(ticking) return; ticking = true;
  requestAnimationFrame(() => {
    ticking = false;
    const st = document.getElementById('stick');
    if(st) st.classList.toggle('on', scrollY > innerHeight * .85);
    const m = document.querySelector('.masthead'), c = document.querySelector('.cutout');
    if(m && c && !reduce && innerWidth > 960){
      const y = Math.min(scrollY, 900);
      m.style.transform = 'translate3d(0,' + (y * .16) + 'px,0)';
      c.style.transform = 'translate3d(-50%,' + (-y * .04) + 'px,0)';
    }
    progress();
  });
}
function progress(){
  const a = document.querySelector('.prose');
  if(!a){ bar.style.transform = 'scaleX(0)'; return; }
  const r = a.getBoundingClientRect();
  const total = Math.max(1, a.offsetHeight - innerHeight * .5);
  bar.style.transform = 'scaleX(' + Math.min(1, Math.max(0, -r.top / total)) + ')';
}
addEventListener('scroll', onScroll, {passive:true});

function route(){
  document.querySelectorAll('.lb').forEach(n => n.remove()); document.body.style.overflow = '';
  const h = location.hash.replace(/^#\/?/, '');
  const [a, b] = h.split('/');
  document.title = SITE.short + ' | Notes on building AI and the web';
  if(a === 'post'){
    $app.innerHTML = postPage(b);
    scrollTo(0,0);
  } else {
    $app.innerHTML = home();
    const map = {stage:'stage', stories:'stories', writing:'stories', work:'work', projects:'work', photos:'photos', events:'photos', about:'about', contact:'contact', elsewhere:'contact'};
    const el = map[a] && document.getElementById(map[a]);
    if(el) el.scrollIntoView(); else scrollTo(0,0);
  }
  enhance();
  fitMasthead();
  progress();
}
addEventListener('hashchange', route);
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('a[href^="#/"]');
  if(a && a.getAttribute('href') === location.hash) { e.preventDefault(); route(); }
});
route();
</script>
